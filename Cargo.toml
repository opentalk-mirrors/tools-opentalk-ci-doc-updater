[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
description = "Tool to update code blocks in the documentation"
documentation = "https://docs.rs/opentalk-ci-doc-updater"
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-ci-doc-updater"
publish = true
repository = "https://git.opentalk.dev/opentalk/tools/opentalk-ci-doc-updater"
version = "0.2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
once_cell = "1"
regex = "1"
snafu = "0.8"

[dev-dependencies]
pretty_assertions = "1"
